name: Build pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build_site.py"
      - "scripts/build_legal.py"
      - "scripts/legal_style.css"
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python scripts/build_site.py
          python scripts/build_legal.py
      - name: Commit if changed
        run: |
          git add -A index.html en.html terms.html privacy.html refund.html 404.html fr
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "AmidTech Build Bot"
          git config user.email "build-bot@amidtechgroup.com"
          git commit -m "Build pages from sources"
          git pull --rebase origin main
          git push
